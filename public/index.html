<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini File Search - RAG Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Upload Screen -->
        <div id="uploadScreen" class="screen active">
            <div class="header">
                <h1>Gemini File Search</h1>
                <p class="subtitle">Experience the simplicity of RAG with Google Gemini</p>
            </div>

            <div class="upload-area">
                <div class="upload-box" id="uploadBox">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <h2>Upload Your PDF</h2>
                    <p>Drag and drop or click to select a file</p>
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                    <button class="btn btn-primary" id="selectFileBtn">Select File</button>
                </div>

                <div id="uploadProgress" class="upload-progress hidden">
                    <div class="spinner"></div>
                    <p>Uploading and processing your file...</p>
                </div>

                <div id="uploadSuccess" class="upload-success hidden">
                    <svg class="success-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <h3>File uploaded successfully!</h3>
                    <p id="uploadedFileName"></p>
                    <button class="btn btn-primary" id="startQuestionsBtn">Start Asking Questions</button>
                </div>
            </div>
        </div>

        <!-- Q&A Screen -->
        <div id="qaScreen" class="screen">
            <div class="header">
                <h1>Ask Questions About Your Document</h1>
                <p class="subtitle" id="documentName"></p>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message">
                        <p>Your document is ready! Ask me anything about it.</p>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <input
                            type="text"
                            id="questionInput"
                            class="chat-input"
                            placeholder="Ask a question about your document..."
                            autocomplete="off"
                        >
                        <button class="btn btn-send" id="sendBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <button class="btn btn-secondary" id="uploadNewFileBtn">Upload New File</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
